id: axi-go
title: axi-go
description: Initial product specification generated by roady.
features:
    - id: core-foundation
      title: Core Foundation
      description: The essential building blocks of the project.
      requirements: []
    - id: api-stability-for-1.0
      title: API stability for 1.0
      description: Every exported type, function, and method in the axi, domain, application, inmemory, jsonstore, and toon packages is either frozen for 1.x or explicitly marked `// Deprecated:` with a defined removal schedule. No silent removals between minor versions post-1.0. Deprecation policy documented in docs/ROADMAP.md.
      requirements: []
    - id: godoc-completeness
      title: Godoc completeness
      description: Every exported name carries a narrative doc comment, and at least one Example* function exists for every top-level API surface (Kernel methods, toon.Encode, axi.Truncate, domain.Pipeline). Examples appear in go doc and at pkg.go.dev.
      requirements: []
    - id: persistence-schema-frozen-at-v1
      title: Persistence schema frozen at v1
      description: SessionSnapshot.Schema == "1" is the 1.x persistence format. Future incompatible changes bump the schema and ship with a documented migration. jsonstore round-trip tests cover every persisted field (Suggestions, TokensUsed, ApprovalDecision, schema version, legacy-without-schema loading).
      requirements: []
    - id: ci-quality-floor
      title: CI quality floor
      description: 'Every CI gate green on main before 1.0: fmt, lint (golangci-lint v2), go vet, build, test with race detector, coverage >= 60%, govulncheck, nightly fuzz-smoke on toon.Encode (-fuzztime=5m). Coverage regressions fail the build.'
      requirements: []
    - id: security-posture-for-1.0
      title: Security posture for 1.0
      description: SECURITY.md reflects current practice. Release workflow signs SBOM with cosign keyless (GitHub OIDC). CycloneDX SBOM attached to every GitHub Release. Branch protection live on main. CODEOWNERS enforced. Dependabot + secret scanning + push protection enabled. Private vulnerability reporting enabled. Documented in docs/SECURITY-SETUP.md.
      requirements: []
    - id: adoption-signal
      title: Adoption signal
      description: At least one production use case outside the author's own systems, OR an explicit decision documented in the v1.0.0 release notes to ship 1.0 without one. The decision-with-rationale path is acceptable; the box is checked either way once the rationale is captured.
      requirements: []
constraints: []
version: 0.1.0

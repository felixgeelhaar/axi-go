version: 1
language: go
# Local/CI floor. Shared go-ci runs `coverctl check --profile=coverage.out`.
# `make cover` additionally enforces --ratchet against .cover/history.json.
policy:
  default:
    min: 72
  domains:
    - name: module
      match:
        - ./...
      exclude:
        - ./example/...
      min: 72
